syntax = "proto3";

package project_template_go.api.v1;

option go_package = "github.com/0xdevelop/project_template_go/api/api_grpc/protobuf;api_grpc_protobuf";

import "google/protobuf/struct.proto";

message CallRequest {
  string request_id = 1;
  string method = 2;
  google.protobuf.Struct params = 3;
}

message CallResponse {
  string request_id = 1;
  google.protobuf.Struct result = 2;
}

service APIService {
  rpc Call(CallRequest) returns (CallResponse);
}
