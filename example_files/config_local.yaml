mysql_cfg: # Mysql configurations
  dbname: "project_template_go"
  dbuser: "project_template_go"
  dbpwd: "project_template_go_pwd"
  dbaddress: "127.0.0.1"
  dbport: "3306"
  dbtimezone: 0
api_cfg: # API configurations
  api_cfg_jsonRPC: # API configurations with JSON-RPC
    enabled: true
    port: 13001
    encryption_enabled: false
  api_cfg_mcp: # API configurations with MCP
    enabled: true
    port: 13002
    mcp_transport_type: "streamable-http"
  api_cfg_websocket: # API configurations with WebSocket
    enabled: true
    port: 13004
    allowed_origins:
    - "127.0.0.1:*"
    - "localhost:*"
  api_cfg_grpc: # API configurations with gRPC
    enabled: true
    port: 13005
policy_cfg: # Policy scheduling configurations
  policy_duration: "10s" # 定期轮询事项执行完一次到下一次的间隔，Go duration 字符串
  workers_scaller: 5 # 最大异步并发 = CPU 数量 × 倍率
auth_cfg: # Auth configurations
  email: # Email delivery configuration
    provider: "resend"
    api_key: ""
    from: ""
    reply_to: ""
    product_name: "project_template_go"
    verification_subject: "project_template_go verification code"
  verification: # Verification code policy
    code_ttl_seconds: 600
    max_attempts: 5
    resend_interval_seconds: 60
    hourly_send_limit: 5
    code_hash_secret: "dev_local_code_hash_secret_0123456789"
  session: # JWT and refresh session policy
    jwt_signing_secret: "dev_local_jwt_signing_secret_0123456789"
    issuer: "project_template_go"
    audience: "project_template_go"
    access_token_ttl_seconds: 900
    refresh_token_ttl_seconds: 2592000
